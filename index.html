<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>

<style>
body{
    margin:0;
    background:#f0f2f5;
    font-family:Arial,sans-serif;
}

.chat{
    width:380px;
    height:600px;
    margin:30px auto;
    background:#fff;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    background:#0d6efd;
    color:#fff;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
    background:#f7f7f7;
}

.msg{
    margin:10px 0;
    padding:10px;
    border-radius:10px;
    max-width:80%;
    word-wrap:break-word;
}

.user{
    background:#0d6efd;
    color:white;
    margin-left:auto;
}

.bot{
    background:#e4e6eb;
    color:black;
}

.footer{
    display:flex;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    border:none;
    padding:15px;
    outline:none;
    font-size:16px;
}

button{
    width:90px;
    border:none;
    background:#0d6efd;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0b5ed7;
}
</style>
</head>

<body>

<div class="chat">

<div class="header">
🤖 AI Assistant
</div>

<div class="messages" id="messages">
<div class="msg bot">
Halo 👋 Ada yang bisa saya bantu?
</div>
</div>

<div class="footer">
<input id="text" placeholder="Tulis pesan..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">Kirim</button>
</div>

</div>

<script>

const API_KEY="sk-proj-xxxxxxxxxxxxxxxxxxxxxxxx";

const messages=document.getElementById("messages");

function addMessage(text,type){

    let div=document.createElement("div");

    div.className="msg "+type;

    div.innerHTML=text;

    messages.appendChild(div);

    messages.scrollTop=messages.scrollHeight;

}

async function send(){

    let input=document.getElementById("text");

    let text=input.value.trim();

    if(text=="") return;

    addMessage(text,"user");

    input.value="";

    let loading=document.createElement("div");

    loading.className="msg bot";

    loading.innerHTML="Mengetik...";

    messages.appendChild(loading);

    messages.scrollTop=messages.scrollHeight;

    try{

        const response=await fetch("https://api.openai.com/v1/chat/completions",{

            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer "+API_KEY
            },

            body:JSON.stringify({

                model:"gpt-4.1-mini",

                messages:[
                    {
                        role:"system",
                        content:"Kamu adalah asisten AI yang ramah dan selalu menjawab dalam bahasa Indonesia."
                    },
                    {
                        role:"user",
                        content:text
                    }
                ]

            })

        });

        const data=await response.json();

        loading.innerHTML=data.choices[0].message.content;

    }catch(err){

        loading.innerHTML="❌ Gagal terhubung ke AI.";

        console.log(err);

    }

}

</script>

</body>
</html>
