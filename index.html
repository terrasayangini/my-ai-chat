<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>

<style>
body{
    margin:0;
    background:#f0f2f5;
    font-family:Arial,sans-serif;
}

.chat{
    width:380px;
    height:600px;
    margin:30px auto;
    background:#fff;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    background:#0d6efd;
    color:#fff;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
    background:#f7f7f7;
}

.msg{
    margin:10px 0;
    padding:10px;
    border-radius:10px;
    max-width:80%;
    word-wrap:break-word;
}

.user{
    background:#0d6efd;
    color:white;
    margin-left:auto;
}

.bot{
    background:#e4e6eb;
    color:black;
}

.footer{
    display:flex;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    border:none;
    padding:15px;
    outline:none;
    font-size:16px;
}

button{
    width:90px;
    border:none;
    background:#0d6efd;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0b5ed7;
}
</style>

</head>

<body>

<div class="chat">

<div class="header">
🧸 Bearly
AI Assistant 🌼
</div>

<div class="messages" id="messages">

<div class="msg bot">
Halo 👋 Namaku Bearly..!
Buku apa yang pernah kamu baca?
Ayo kita diskusikan.
Aku juga bisa kasih Saran atau Tips buat kamu.
</div>

</div>


<div class="footer">

<input 
id="text" 
placeholder="Tulis pesan..." 
onkeypress="if(event.key==='Enter')send()">

<button onclick="send()">Kirim</button>

</div>


</div>


<script>

const messages = document.getElementById("messages");


// memory percakapan sementara
let chatHistory = [];


function addMessage(text,type){

    let div=document.createElement("div");

    div.className="msg "+type;

    div.innerHTML=text;

    messages.appendChild(div);

    messages.scrollTop=messages.scrollHeight;

}



async function send(){

    let input=document.getElementById("text");

    let text=input.value.trim();


    if(text=="") return;


    addMessage(text,"user");

    input.value="";


    // simpan pesan user
    chatHistory.push({
        role:"user",
        content:text
    });



    let loading=document.createElement("div");

    loading.className="msg bot";

    loading.innerHTML="Mengetik...";

    messages.appendChild(loading);

    messages.scrollTop=messages.scrollHeight;



    try{


        const response = await fetch("/api/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },


            body:JSON.stringify({

                message:text,

                // kirim 2 percakapan terakhir
                history:chatHistory.slice(-4)

            })

        });



        const data = await response.json();



        let reply = data.reply || "AI tidak menjawab.";


        loading.innerHTML = reply;



        // simpan jawaban AI
        chatHistory.push({

            role:"assistant",

            content:reply

        });



        // jaga hanya 2 percakapan
        if(chatHistory.length > 4){

            chatHistory = chatHistory.slice(-4);

        }



    }catch(err){


        loading.innerHTML="❌ Gagal terhubung ke AI.";

        console.log(err);


    }


}


</script>


</body>
</html>
